---
- name: Users and sudo
  ansible.builtin.import_tasks: users.yml

- name: Firewall
  ansible.builtin.import_tasks: firewall.yml

- name: SELinux
  ansible.builtin.import_tasks: selinux.yml

- name: SSH
  ansible.builtin.import_tasks: ssh.yml

- name: Time sync
  ansible.builtin.import_tasks: time.yml

- name: Tuned
  ansible.builtin.import_tasks: tuned.yml

- name: Journal
  ansible.builtin.import_tasks: journal.yml

- name: Install vim
  ansible.builtin.dnf:
    name: vim-enhanced
    state: present

- name: Write the login message
  ansible.builtin.copy:
    dest: /etc/motd.d/ansible
    content: "Managed by Ansible (ansible/playbooks/base.yml). Changes by hand are overwritten.\n"
    owner: root
    group: root
    mode: "0644"
