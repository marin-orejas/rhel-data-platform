---
- name: Install the ACL tools
  ansible.builtin.dnf:
    name: acl
    state: present

- name: Create the shared dba directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: dba
    mode: "2770"
  loop: "{{ base_dba_dirs }}"

- name: Set the default ACL for dba
  ansible.posix.acl:
    path: "{{ item }}"
    etype: group
    entity: dba
    permissions: rwx
    default: true
    state: present
  loop: "{{ base_dba_dirs }}"
