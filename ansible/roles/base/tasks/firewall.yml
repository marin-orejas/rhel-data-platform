---
- name: Keep firewalld enabled and running
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Allow the services
  ansible.posix.firewalld:
    service: "{{ item }}"
    zone: public
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ base_firewall_services + base_firewall_extra_services }}"

- name: Allow the ports
  ansible.posix.firewalld:
    port: "{{ item }}"
    zone: public
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ base_firewall_ports }}"
