---
- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep the journal on disk
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/50-persistent-storage.conf
    content: |
      [Journal]
      Storage=persistent
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
