---
- name: Layout, bucket and key as the garage user
  become: true
  become_user: garage
  block:
    - name: Read the node ID
      ansible.builtin.command: /usr/local/bin/garage node id -q
      register: garage_node_id
      changed_when: false
      check_mode: false

    - name: Read the cluster status
      ansible.builtin.command: /usr/local/bin/garage status
      register: garage_status
      changed_when: false
      check_mode: false

    - name: Give the node its role
      ansible.builtin.command: >-
        /usr/local/bin/garage layout assign -z {{ garage_zone }} -c {{ garage_capacity }}
        {{ garage_node_id.stdout.split('@') | first }}
      changed_when: true
      when: "'NO ROLE ASSIGNED' in garage_status.stdout"

    - name: Apply the first layout
      ansible.builtin.command: /usr/local/bin/garage layout apply --version 1
      changed_when: true
      when: "'NO ROLE ASSIGNED' in garage_status.stdout"

    - name: Look for the bucket
      ansible.builtin.command: /usr/local/bin/garage bucket info {{ garage_bucket }}
      register: garage_bucket_info
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Create the bucket
      ansible.builtin.command: /usr/local/bin/garage bucket create {{ garage_bucket }}
      changed_when: true
      when: garage_bucket_info.rc != 0

    - name: Look for the key
      ansible.builtin.command: /usr/local/bin/garage key info {{ garage_key_name }}
      register: garage_key_info
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Import the key
      ansible.builtin.command: >-
        /usr/local/bin/garage key import --yes -n {{ garage_key_name }}
        {{ garage_s3_key_id }} {{ garage_s3_secret_key }}
      changed_when: true
      no_log: true
      when: garage_key_info.rc != 0

    - name: Allow the key on the bucket
      ansible.builtin.command: >-
        /usr/local/bin/garage bucket allow --read --write
        --key {{ garage_key_name }} {{ garage_bucket }}
      changed_when: true
      when: garage_bucket_info.rc != 0 or garage_key_info.rc != 0
