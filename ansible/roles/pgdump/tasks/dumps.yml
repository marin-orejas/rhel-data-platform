---
- name: Install bzip2 for the config archive
  ansible.builtin.dnf:
    name: bzip2
    state: present

- name: Install the backup script
  ansible.builtin.copy:
    src: pg-backup.sh
    dest: /usr/local/bin/pg-backup.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the backup service
  ansible.builtin.template:
    src: pg-backup.service.j2
    dest: /etc/systemd/system/pg-backup.service
    owner: root
    group: root
    mode: "0644"
  register: pgdump_service_unit

- name: Install the backup timer
  ansible.builtin.copy:
    src: pg-backup.timer
    dest: /etc/systemd/system/pg-backup.timer
    owner: root
    group: root
    mode: "0644"
  register: pgdump_timer_unit

- name: Keep the backup timer enabled and running
  ansible.builtin.systemd_service:
    name: pg-backup.timer
    enabled: true
    state: started
    daemon_reload: "{{ pgdump_service_unit is changed or pgdump_timer_unit is changed }}"
