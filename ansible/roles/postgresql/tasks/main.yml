---
- name: Install the PostgreSQL packages
  ansible.builtin.dnf:
    name: "{{ postgresql_packages }}"
    state: present

- name: Stop if the data disk is not mounted
  ansible.builtin.command: "mountpoint -q {{ postgresql_mount_point }}"
  changed_when: false
  check_mode: false

- name: Create the cluster's parent directory
  ansible.builtin.file:
    path: "{{ postgresql_mount_point }}/pgsql"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Create the service drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/postgresql.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Point the service at the data disk
  ansible.builtin.copy:
    dest: /etc/systemd/system/postgresql.service.d/override.conf
    content: |
      [Unit]
      RequiresMountsFor={{ postgresql_mount_point }}

      [Service]
      Environment=PGDATA={{ postgresql_data_dir }}
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Set PGDATA and PGPORT for postgres
  ansible.builtin.copy:
    dest: /var/lib/pgsql/.bash_profile
    content: |
      [ -f /etc/profile ] && source /etc/profile

      PGDATA={{ postgresql_data_dir }}
      export PGDATA
      export PGPORT=5433
    owner: postgres
    group: postgres
    mode: "0644"

- name: Apply the drop-in before the cluster is created
  ansible.builtin.meta: flush_handlers

- name: TLS certificates and keys
  ansible.builtin.import_tasks: tls.yml

- name: Store the passwords for the other db host
  ansible.builtin.copy:
    dest: /var/lib/pgsql/.pgpass
    content: |
      {{ postgresql_peer_address }}:5433:replication:replicator:{{ postgresql_replicator_password }}
      {{ postgresql_peer_address }}:5433:postgres:rewind:{{ postgresql_rewind_password }}
    owner: postgres
    group: postgres
    mode: "0600"
  no_log: true
  diff: false

- name: Create the cluster on an empty data disk
  ansible.builtin.command: postgresql-setup --initdb
  args:
    creates: "{{ postgresql_data_dir }}/PG_VERSION"
  when: not postgresql_build_standby

- name: Copy the cluster from the primary on an empty data disk
  ansible.builtin.command: >-
    pg_basebackup -d "{{ postgresql_primary_conninfo }}"
    -D {{ postgresql_data_dir }} -S {{ inventory_hostname }} -X stream -c fast
  args:
    creates: "{{ postgresql_data_dir }}/PG_VERSION"
  become_user: postgres
  register: postgresql_copy
  when: postgresql_build_standby

- name: Point the new copy at the primary
  ansible.builtin.copy:
    dest: "{{ postgresql_data_dir }}/postgresql.auto.conf"
    content: |
      # Do not edit this file manually!
      # It will be overwritten by the ALTER SYSTEM command.
      primary_slot_name = '{{ inventory_hostname }}'
      primary_conninfo = '{{ postgresql_primary_conninfo }}'
    owner: postgres
    group: postgres
    mode: "0600"
  when: postgresql_copy is changed

- name: Start the new copy as a standby
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}/standby.signal"
    state: touch
    owner: postgres
    group: postgres
    mode: "0600"
  when: postgresql_copy is changed

- name: Write postgresql.conf from the template
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ postgresql_data_dir }}/postgresql.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reload PostgreSQL

- name: Write pg_hba.conf from the template
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reload PostgreSQL

- name: Keep PostgreSQL enabled and running
  ansible.builtin.systemd_service:
    name: postgresql
    enabled: true
    state: started

- name: Reload before the settings check
  ansible.builtin.meta: flush_handlers

- name: Stop if a setting in the files is not applied
  ansible.builtin.command: >-
    runuser -u postgres -- psql -p 5433 -XAtc
    "SELECT name, error FROM pg_file_settings WHERE NOT applied"
  register: postgresql_not_applied
  changed_when: false
  check_mode: false
  failed_when: >-
    postgresql_not_applied.rc != 0 or
    postgresql_not_applied.stdout != ""

- name: Stop if a pg_hba.conf line has an error
  ansible.builtin.command: >-
    runuser -u postgres -- psql -p 5433 -XAtc
    "SELECT line_number, error FROM pg_hba_file_rules WHERE error IS NOT NULL"
  register: postgresql_hba_error
  changed_when: false
  check_mode: false
  failed_when: >-
    postgresql_hba_error.rc != 0 or
    postgresql_hba_error.stdout != ""

- name: Stop if the server does not offer TLS with its own certificate
  ansible.builtin.command: >-
    openssl s_client -starttls postgres -connect 127.0.0.1:5433
    -CAfile /var/lib/pgsql/.postgresql/root.crt
    -verify_hostname {{ inventory_hostname }} -verify_return_error
  args:
    stdin: Q
  changed_when: false
  when: not ansible_check_mode

- name: Roles and app databases
  ansible.builtin.import_tasks: databases.yml
