base_firewall_extra_services:
  - nfs
  - https

nfs_exports:
  - name: backup
    line: /srv/backup 192.168.122.11(rw)

pgbackrest_repo_path: /srv/backup/pgbackrest
pgbackrest_create_repo: true

pgdump_dest: /srv/backup/pgsql
pgdump_create_dest: true

storage_pools:
  - name: data
    type: lvm
    disks:
      - vdb
    volumes:
      - name: backup
        size: 3 GiB
        fs_type: xfs
        fs_label: backup
        mount_point: /srv/backup
      - name: pgdata
        size: 5 GiB
        fs_type: xfs
        fs_label: pgdata
        mount_point: /pgdata
  - name: objects
    type: lvm
    disks:
      - vdc
    volumes:
      - name: garage
        size: 100%
        fs_type: xfs
        fs_label: garage
        mount_point: /srv/garage

