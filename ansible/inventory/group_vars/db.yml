---
base_firewall_services:
  - ssh
  - cockpit
  - dhcpv6-client
base_firewall_ports:
  - 5433/tcp

base_selinux_fcontexts:
  - target: /pgdata(/.*)?
    setype: postgresql_db_t
base_selinux_ports:
  - ports: "5433"
    proto: tcp
    setype: postgresql_port_t

postgresql_extra_settings:
  port: "5433"
  listen_addresses: "*"
  archive_mode: "on"
  archive_command: "pgbackrest --stanza=main archive-push %p"
  max_slot_wal_keep_size: "1GB"
  log_line_prefix: "%m [%p] %q%u@%d "
  ssl: "on"
  ssl_cert_file: "{{ postgresql_tls_dir }}/server.crt"
  ssl_key_file: "{{ postgresql_tls_dir }}/server.key"

postgresql_hba_extra_rules:
  - {type: hostssl, database: postgres, user: remote_test, address: 192.168.122.12/32, method: scram-sha-256}
  - {type: hostssl, database: replication, user: replicator, address: 192.168.122.12/32, method: scram-sha-256}
  - {type: hostssl, database: replication, user: replicator, address: 192.168.122.11/32, method: scram-sha-256}
  - {type: hostssl, database: postgres, user: rewind, address: 192.168.122.11/32, method: scram-sha-256}
  - {type: hostssl, database: postgres, user: rewind, address: 192.168.122.12/32, method: scram-sha-256}
  - {type: hostssl, database: lab, user: remote_test, address: 192.168.122.12/32, method: scram-sha-256}
  - {type: hostssl, database: app, user: app, address: 192.168.122.12/32, method: scram-sha-256}
  - {type: hostssl, database: app, user: report, address: 192.168.122.12/32, method: scram-sha-256}

postgresql_login_roles:
  - app
  - report

postgresql_app_databases:
  - name: app
    schema: app
    owner: app
    readers:
      - report

