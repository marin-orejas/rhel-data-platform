apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: web
  labels:
    app: web
  annotations:
    kubernetes.io/change-cause: token from the Secret web-token as APP_TOKEN and /etc/web/token
spec:
  replicas: 2
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi10/httpd-24:10.3-1793879148
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_RELEASE
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: APP_RELEASE
            - name: APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: web-token
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /.noindex.html
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /.noindex.html
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: page
              mountPath: /var/www/html
            - name: token
              mountPath: /etc/web
      volumes:
        - name: page
          configMap:
            name: web-config
            items:
              - key: index.html
                path: index.html
        - name: token
          secret:
            secretName: web-token
            defaultMode: 0440
