apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: web
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - policy-deny-ingress.yaml
  - policy-allow-client.yaml
  - policy-allow-gateway.yaml
  - httproute.yaml
configMapGenerator:
  - name: web-config
    files:
      - index.html
    literals:
      - APP_RELEASE=3
    options:
      labels:
        app: web
